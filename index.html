    document.getElementById('pressure').addEventListener('input',e=>{pressure=+e.target.value/100;document.getElementById('pressureValue').value=e.target.value;});
    const settled=new Float64Array(N*3);
    function reset(){stopContact();motion=false;support=.6;pressure=.55;document.getElementById('support').value=60;document.getElementById('supportValue').value=60;document.getElementById('pressure').value=55;document.getElementById('pressureValue').value=55;document.getElementById('motion').setAttribute('aria-pressed','false');root.set(0,0,0);rootVelocity.set(0,0,0);rootTarget.set(0,0,0);model.position.set(0,0,0);pos.set(settled);prev.set(settled);for(const arm of armSurfaces){arm.pos.set(arm.rest);arm.prev.set(arm.rest);}time=0;accumulator=0;setMode('touch');awakeSteps=0;frame();updateGeometry();}
    function hideUI(value){document.body.classList.toggle('clean',value===undefined?!document.body.classList.contains('clean'):value);}
    document.getElementById('reset').addEventListener('click',reset);document.getElementById('hide').addEventListener('click',()=>hideUI());
    window.addEventListener('keydown',event=>{if(event.metaKey||event.ctrlKey||event.altKey||event.repeat)return;if(event.code==='KeyH')hideUI();if(event.code==='KeyR'&&window.fitStudyReady)reset();if(event.code==='Escape'){stopContact();hideUI(false);}});
    canvas.addEventListener('dblclick',()=>{if(document.body.classList.contains('clean'))hideUI(false);});
    window.addEventListener('resize',()=>{stopContact();camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);frame();});

    // Settle gravity and garment support before the first displayed frame.
    settling=true;for(let batch=0;batch<8;batch++){for(let i=0;i<30;i++)simulate();await new Promise(resolve=>setTimeout(resolve,0));}settling=false;time=0;settled.set(pos);prev.set(pos);updateGeometry();
    renderer.render(scene,camera);window.fitStudyReady=true;loader.classList.add('done');setTimeout(()=>loader.remove(),650);
    function animate(now){requestAnimationFrame(animate);if(document.hidden){lastTime=0;return;}const elapsed=lastTime?Math.min(.05,(now-lastTime)/1000):DT;lastTime=now;let steps=0;
      if(moving||touchState||motion||awakeSteps>0){accumulator=Math.min(accumulator+elapsed,DT*6);while(accumulator>=DT&&steps<6){simulate();accumulator-=DT;steps++;if(awakeSteps>0)awakeSteps--;}}else accumulator=0;
      if(steps){updateGeometry();needsRender=true;}if(!moving&&!touchState&&controls.update())needsRender=true;if(needsRender){renderer.render(scene,camera);needsRender=false;}}
    requestAnimationFrame(animate);
    // Read-only hooks used to verify stability and garment attachment.
    window.fitStudy=Object.freeze({inspect:()=>({vertices:N,clothVertices:clothParts.reduce((a,p)=>a+p.bindings.length,0),mode,moving:Boolean(moving),touching:Boolean(touchState),site:touchState?tissueLabel(touchState.surface,touchState.nearest):null,contact:touchState?{depth:touchState.depth,nearest:touchState.nearest,normal:touchState.normal.toArray(),original:touchState.anchor.toArray(),current:Array.from(touchState.surface.pos.slice(touchState.nearest*3,touchState.nearest*3+3))}:null,motion,support,pressure,root:root.toArray(),camera:camera.position.toArray(),positions:Array.from(pos),armPositions:armSurfaces.map(a=>Array.from(a.pos)),settled:Array.from(settled),volume:volume(),restVolume}),project:(x,y,z)=>{const p=new THREE.Vector3(x,y,z).add(root).project(camera);return{x:(p.x+1)*innerWidth/2,y:(1-p.y)*innerHeight/2};}});
  </script>
